<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nguyen Dang Khoa - Software Engineer</title>
  <desc id="desc">Portfolio-style profile heading for Nguyen Dang Khoa.</desc>
  <style>
    :root {
      --bg: #F4F3EF;
      --fg: #0F0F0D;
      --body: #2A2A27;
      --muted: #6B6A65;
      --border: #D4D2CB;
      --accent: #0052FF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11110F;
        --fg: #F3F2ED;
        --body: #D8D6CF;
        --muted: #A7A59E;
        --border: #373733;
        --accent: #5B82FF;
      }
    }

    .frame {
      fill: transparent;
      stroke: var(--border);
      transition: stroke 0.25s ease;
    }

    .kicker,
    .role {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      fill: var(--muted);
      transition: fill 0.25s ease;
    }

    .name {
      font-family: "Instrument Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 74px;
      font-weight: 700;
      letter-spacing: -0.03em;
      fill: var(--fg);
      transition: fill 0.25s ease;
    }

    .copy {
      font-family: "Instrument Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      fill: var(--body);
      transition: fill 0.25s ease;
    }

    .accent-line {
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 144 560;
      transition: stroke-dasharray 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    svg:hover .name,
    svg:hover .role {
      fill: var(--accent);
    }

    svg:hover .frame {
      stroke: var(--accent);
    }

    svg:hover .accent-line {
      stroke-dasharray: 704 0;
    }
  </style>

  <rect class="frame" x="1" y="1" width="898" height="178" rx="1" />
  <path class="accent-line" d="M1 178H705" />

  <text class="kicker" x="36" y="44">00 / HOME - HO CHI MINH CITY, VIETNAM</text>
  <text class="name" x="34" y="112">NGUYEN DANG KHOA</text>
  <text class="role" x="38" y="146">SOFTWARE ENGINEER / </text>
</svg>
